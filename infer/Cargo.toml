[package]
name = "memetag-infer"
version = "0.3.1"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
memetag = { path = ".." }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-27"] }
